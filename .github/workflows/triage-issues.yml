name: Triage New Issues (multi-agent)

# Triggers the triage agent (pi-framework) when a new GitHub issue is opened.
# Two-job pattern: a read-only `triage` job produces a JSON decision, then a
# deterministic `apply` job posts the comment and applies the label. This
# keeps the agent scoped to issues: read only — it never holds issue: write.

on:
  issues:
    types: [opened]

concurrency:
  group: triage-issue-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    name: Triage with multi-agent factory
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      triage_result: ${{ steps.run_agent.outputs.triage_result }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install factory dependencies
        run: npm ci --prefix factory

      - name: Run triage agent
        id: run_agent
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/factory
          cat > /tmp/factory/issue.json <<EOF
          { "number": "$ISSUE_NUMBER", "title": "$ISSUE_TITLE", "body": "$ISSUE_BODY", "labels": [], "author": "${{ github.event.issue.user.login }}", "url": "${{ github.event.issue.html_url }}", "createdAt": "${{ github.event.issue.created_at }}", "comments": [] }
          EOF
          cd factory
          npx tsx src/cli/run-issue.ts --issue /tmp/factory/issue.json > /tmp/factory/out.json 2>&1
          cat /tmp/factory/out.json
          TRIAGE_JSON=$(node -e "const r=require('/tmp/factory/out.json'); console.log(JSON.stringify({state:r.triage,label:r.triage?.toLowerCase().replace(/ /g,'-'),remove_labels:[],comment:'See agent run for triage rationale.'}))" 2>/dev/null || echo "{}")
          echo "triage_result=$TRIAGE_JSON" >> "$GITHUB_OUTPUT"

  apply:
    name: Apply triage result
    needs: triage
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Apply label and comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TRIAGE_RESULT: ${{ needs.triage.outputs.triage_result }}
        run: |
          echo "$TRIAGE_RESULT" > triage_result.json
          STATE=$(jq -r '.state // ""' triage_result.json)
          LABEL=$(jq -r '.label // ""' triage_result.json)
          if [ -z "$LABEL" ]; then
            echo "no label produced; nothing to apply"
            exit 0
          fi
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label "$LABEL" || true
          COMMENT=$(jq -r '.comment // ""' triage_result.json)
          if [ -n "$COMMENT" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "$COMMENT" || true
          fi