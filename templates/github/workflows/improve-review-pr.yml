name: Improve Review PR (multi-agent)

# Daily outer loop. Collects review feedback, synthesizes durable
# learnings, and opens a skill-improvement PR when warranted.
# Uses the software-factory-cli npm package; no source copy.

on:
  schedule:
    - cron: "7 3 * * *"
  workflow_dispatch:

jobs:
  improve:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install factory package
        run: npm install software-factory-cli --no-audit --no-fund

      - name: Run improve-review-pr agent
        run: |
          mkdir -p /tmp/factory
          cat > /tmp/factory/issue.json <<EOF
          { "number": 0, "title": "Daily improve-review-pr", "body": "", "labels": [], "author": "scheduled", "url": "", "createdAt": "$(date -Iseconds)", "comments": [] }
          EOF
          node node_modules/software-factory-cli/dist/factory/run-issue.js --issue /tmp/factory/issue.json
