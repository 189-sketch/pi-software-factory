name: Spec Ready Issues (multi-agent)

# Triggers the spec agent when an issue is labeled `ready-to-spec`.

on:
  issues:
    types: [labeled]

jobs:
  spec:
    if: github.event.label.name == 'ready-to-spec'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install factory dependencies
        run: npm ci --prefix factory

      - name: Run spec agent
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/factory
          cat > /tmp/factory/issue.json <<EOF
          { "number": "$ISSUE_NUMBER", "title": "$ISSUE_TITLE", "body": "$ISSUE_BODY", "labels": ["ready-to-spec"], "author": "issue-bot", "url": "${{ github.event.issue.html_url }}", "createdAt": "${{ github.event.issue.created_at }}", "comments": [] }
          EOF
          cd factory
          npx tsx src/cli/run-issue.ts --issue /tmp/factory/issue.json