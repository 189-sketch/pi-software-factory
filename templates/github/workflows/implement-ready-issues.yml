name: Implement Ready Issues (multi-agent)

# Triggers the implementation agent (with verify-behavior subagent for UI
# work) when an issue is labeled `ready-to-implement`.
# Uses the software-factory-cli npm package; no source copy.

on:
  issues:
    types: [labeled]

jobs:
  implement:
    if: github.event.label.name == 'ready-to-implement'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install factory package
        run: npm install software-factory-cli --no-audit --no-fund

      - name: Run implementation agent
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/factory
          cat > /tmp/factory/issue.json <<EOF
          { "number": "$ISSUE_NUMBER", "title": "$ISSUE_TITLE", "body": "$ISSUE_BODY", "labels": ["ready-to-implement"], "author": "issue-bot", "url": "${{ github.event.issue.html_url }}", "createdAt": "${{ github.event.issue.created_at }}", "comments": [] }
          EOF
          node node_modules/software-factory-cli/dist/factory/run-issue.js --issue /tmp/factory/issue.json
